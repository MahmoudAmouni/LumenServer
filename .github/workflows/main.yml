name: CI/CD Laravel Server

on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]

jobs: 
  ci:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code 
        uses: actions/checkout@v6.0.1

      - name: Install PHP
        uses: shivammathur/setup-php@2.36.0
        with: 
          php-version: 8.4.1
          extensions: pdo, pdo_sqlite

      - name: Setup Composer
        run: |
            composer self-update 2.8.3
            composer --version

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress

      - name: Prepare Laravel 
        run: |
            cp .env.example .env
            php artisan key:generate
            php artisan jwt:secret
            php artisan config:clear
            composer dump-autoload --optimize
            
      - name: Verify Autoloader
        run: |
            php -r "require 'vendor/autoload.php'; echo class_exists('App\\Models\\Offer') ? 'Offer class found' : 'Offer class NOT found'; echo PHP_EOL;"
        
      - name: Run Tests
        run: php artisan test 

  cd: 
     runs-on: ubuntu-latest
     
     needs: ci
     
     steps:
      - name: Checkout code 
        uses: actions/checkout@v6.0.1

      - name: Connect to EC2 Server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.host_name }}
          username: ${{ secrets.username }}
          key: ${{ secrets.key }}